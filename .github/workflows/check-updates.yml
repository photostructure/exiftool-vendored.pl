name: Check for ExifTool Updates

on:
  schedule:
    - cron: "0 12 * * *" # Run every day at 12 PM UTC
  workflow_dispatch: # Allow manual triggering

permissions: {}

concurrency:
  group: check-updates-${{ github.repository }}
  cancel-in-progress: false

jobs:
  check-updates:
    name: Detect an ExifTool update
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Require the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "::error::Update checks must run from $DEFAULT_BRANCH, not $GITHUB_REF"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check for an ExifTool update
        run: |
          if npm run check-version; then
            exit 0
          else
            status=$?
          fi
          if [[ "$status" -eq 1 ]]; then
            echo "::error::A new ExifTool release is available. Run npm run update:exiftool locally."
          fi
          exit "$status"
